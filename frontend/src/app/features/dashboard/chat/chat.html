<div class="flex h-full w-full flex-col">
  <p>Chat</p>
  <div
    class="bg-secondary flex flex-1 flex-col justify-end space-y-4 overflow-y-auto rounded-lg p-4"
  >
    @for (message of messages; track message.id) {
      <div
        class="w-max rounded-lg p-2 text-white"
        [class.bg-primary-l]="message.mine"
        [class.bg-primary-d]="!message.mine"
      >
        {{ message.text }}
      </div>
    }
  </div>

  <div class="flex gap-2">
    <input class="w-full" />
    <button class="btn" (click)="handleMessage()">Send</button>
  </div>
</div>
