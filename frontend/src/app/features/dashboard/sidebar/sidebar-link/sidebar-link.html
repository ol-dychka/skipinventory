<div
  class="cursor-pointer rounded-lg p-4 font-semibold transition-colors duration-300 ease-in-out"
  [ngClass]="{
    'bg-primary-l text-white': isActive,
    'text-primary-d': !isActive,
  }"
>
  {{ name }}

  @if (notification) {
    <span class="bg-error rounded-lg p-1 font-medium text-white">
      {{ notification }}
    </span>
  }
</div>
