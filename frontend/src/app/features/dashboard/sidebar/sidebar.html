<div

>
  <p
    [routerLink]="['dashboard']"
    [ngClass]="{
      'bg-primary-l': isCurrent('dashboard'),
    }"
    (click)="switchPage('dashboard')"
  >
    dashboard
  </p>
  <p
    [routerLink]="['join-requests']"

      'bg-primary-l': isCurrent('join-requests'),

    [ngClass]="{

    }"

  </p>
  <p
    [routerLink]="['sale-records']"
    [ngClass]="{
      'bg-primary-l': isCurrent('sale-records'),
    }"

  >
    sale records
  </p>
  <p
    [routerLink]="['model-training']"
    [ngClass]="{
      'bg-primary-l': isCurrent('model-training'),
    }"
    (click)="switchPage('model-training')"
  >
    ml model training
  </p>
  <p
    [routerLink]="['chat']"

      'bg-primary-l': isCurrent('chat'),
    }"
