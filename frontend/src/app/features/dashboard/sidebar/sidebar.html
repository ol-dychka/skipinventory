<div class="space-y-1">
  <app-sidebar-link
    [routerLink]="['dashboard']"
    (click)="switchPage('dashboard')"
    name="Dashboard"
    [isActive]="isCurrent('dashboard')"
  >
    dashboard
  </app-sidebar-link>
  <app-sidebar-link
    [routerLink]="['join-requests']"
    (click)="switchPage('join-requests')"
    name="Join Requests"
    [isActive]="isCurrent('join-requests')"
    [notification]="organizationService.currentOrganization()?.joinRequests?.length"
  >
    join requests
  </app-sidebar-link>
  <app-sidebar-link
    [routerLink]="['members']"
    (click)="switchPage('members')"
    name="Members"
    [isActive]="isCurrent('members')"
  >
    members
  </app-sidebar-link>
  <app-sidebar-link
    [routerLink]="['products']"
    (click)="switchPage('products')"
    name="Products"
    [isActive]="isCurrent('products')"
  >
    products
  </app-sidebar-link>
  <app-sidebar-link
    [routerLink]="['sale-records']"
    (click)="switchPage('sale-records')"
    name="Sale Records"
    [isActive]="isCurrent('sale-records')"
  >
    sale records
  </app-sidebar-link>
  <app-sidebar-link
    [routerLink]="['model-training']"
    (click)="switchPage('model-training')"
    name="Model Training"
    [isActive]="isCurrent('model-training')"
  >
    ml model training
  </app-sidebar-link>
  <app-sidebar-link
    [routerLink]="['chat']"
    (click)="switchPage('chat')"
    name="Chat"
    [isActive]="isCurrent('chat')"
  >
    chat
  </app-sidebar-link>
</div>
