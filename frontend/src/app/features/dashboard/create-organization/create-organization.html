<div class="centered-v">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-auth-input
      type="text"
      label="Name"
      placeholder="Organization Name"
      formControlName="name"
    />
    <button class="btn w-full" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating…' : 'Create' }}
    </button>
  </form>
</div>
