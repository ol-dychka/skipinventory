<div>
  <div class="flex-right cursor-pointer font-bold" (click)="close.emit()">X</div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- description -->
    <app-scaled-input id="name" label="name" formControlName="name" [error]="fieldError('name')" />
    <div class="flex-left">
      <app-scaled-input formControlName="sku" id="sku" label="sku" [error]="fieldError('sku')" />
      <app-scaled-input
        formControlName="category"
        id="category"
        label="category"
        [error]="fieldError('category')"
      />
    </div>

    <!-- pricing -->
    <div class="flex-left">
      <app-scaled-input
        formControlName="costPrice"
        id="costPrice"
        label="costPrice"
        [error]="fieldError('costPrice')"
      />
      <app-scaled-input
        formControlName="salePrice"
        id="salePrice"
        label="salePrice"
        [error]="fieldError('salePrice')"
      />
      <p>Currency: CAD</p>
    </div>
    <!-- <app-scaled-input formControlName="currency" id="currency" label="currency" /> -->

    <!-- order info -->
    <!-- <app-scaled-input formControlName="unit" id="unit" label="unit" /> -->
    <div class="flex-left">
      <app-scaled-input
        formControlName="currentStock"
        id="currentStock"
        label="currentStock"
        [error]="fieldError('currentStock')"
      />
      <p>Unit: Each</p>
    </div>
    <div class="flex-left">
      <app-scaled-input
        formControlName="reorderPoint"
        id="reorderPoint"
        label="reorderPoint"
        [error]="fieldError('reorderPoint')"
      />
      <app-scaled-input
        formControlName="baseReorderQuantity"
        id="baseReorderQuantity"
        label="baseReorderQuantity"
        [error]="fieldError('baseReorderQuantity')"
      />
    </div>

    <!-- delivery info -->
    <div class="flex-left">
      <app-scaled-input
        formControlName="vendor"
        id="vendor"
        label="vendor"
        [error]="fieldError('vendor')"
      />
      <app-scaled-input
        formControlName="deliveryDelay"
        id="deliveryDelay"
        label="deliveryDelay"
        [error]="fieldError('deliveryDelay')"
      />
    </div>

    <button class="btn mt-8" type="submit">{{ this.loading() ? 'Creating...' : 'Create' }}</button>
  </form>
</div>
