<!-- input edits check github -->
<div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- description -->
    <app-scaled-input id="name" label="name" formControlName="name" />
    <div class="flex-left">
      <app-scaled-input formControlName="sku" id="sku" label="sku" />
      <app-scaled-input formControlName="category" id="category" label="category" />
    </div>

    <!-- pricing -->
    <div class="flex-left">
      <app-scaled-input formControlName="costPrice" id="costPrice" label="costPrice" />
      <app-scaled-input formControlName="salePrice" id="salePrice" label="salePrice" />
      <p>Currency: {{ product().currency }}</p>
    </div>
    <!-- <app-scaled-input formControlName="currency" id="currency" label="currency" /> -->

    <!-- order info -->
    <!-- <app-scaled-input formControlName="unit" id="unit" label="unit" /> -->
    <div class="flex-left">
      <app-scaled-input formControlName="currentStock" id="currentStock" label="currentStock" />
      <p>Unit: {{ product().unit }}</p>
    </div>
    <div class="flex-left">
      <app-scaled-input formControlName="reorderPoint" id="reorderPoint" label="reorderPoint" />
      <app-scaled-input
        formControlName="baseReorderQuantity"
        id="baseReorderQuantity"
        label="baseReorderQuantity"
      />
    </div>

    <!-- delivery info -->
    <div class="flex-left">
      <app-scaled-input formControlName="vendor" id="vendor" label="vendor" />
      <app-scaled-input formControlName="deliveryDelay" id="deliveryDelay" label="deliveryDelay" />
    </div>

    <!-- status -->
    <p>Currently Active:</p>
    <input type="checkbox" id="isActive" formControlName="isActive" class="block" />

    <button class="btn mt-8">Save</button>
  </form>

  <p>Created at: {{ product().createdAt }}</p>
  <p>Last Updated at: {{ product().updatedAt }}</p>
</div>
